{% extends "admin/index.html" %}

{% block content %}

<div style="
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
">

    <!-- CONTACT MESSAGES -->

    <div style="
        background: white;
        padding: 25px;
        border-radius: 10px;
        border-left: 5px solid #d4af37;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    ">

        <h2>📩 Contact Messages</h2>

        <div style="
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
        ">
            {{ contact_count }}
        </div>

        <a href="{% url 'admin:contact_contactmessage_changelist' %}">
            Manage Messages →
        </a>

    </div>


    <!-- GALLERY -->

    <div style="
        background: white;
        padding: 25px;
        border-radius: 10px;
        border-left: 5px solid #d4af37;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    ">

        <h2>🖼️ Gallery Images</h2>

        <div style="
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
        ">
            {{ gallery_count }}
        </div>

        <a href="{% url 'admin:gallery_galleryimage_changelist' %}">
            Manage Gallery →
        </a>

    </div>


    <!-- VIDEOS -->

    <div style="
        background: white;
        padding: 25px;
        border-radius: 10px;
        border-left: 5px solid #d4af37;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    ">

        <h2>🎬 Videos</h2>

        <div style="
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
        ">
            {{ video_count }}
        </div>

        <a href="{% url 'admin:videos_video_changelist' %}">
            Manage Videos →
        </a>

    </div>

</div>


{{ block.super }}

{% endblock %}
